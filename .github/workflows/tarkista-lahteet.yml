name: Tarkista lähteet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tarkista:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/tarkista-lahteet.mjs
