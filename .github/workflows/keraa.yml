name: Kerää

on:
  schedule:
    # UTC-aikaa: 5–21 UTC = klo 7–23 Suomen talviaikaa. Minuutit 7 ja 37 välttävät tasatuntien ruuhkan.
    - cron: '7,37 5-21 * * *'
  workflow_dispatch:
    inputs:
      pakota:
        description: 'Tee tekoälytiivistelmä heti (ohita 2 tunnin odotus)'
        type: boolean
        default: false

concurrency:
  group: keraa
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # keepalive: estää GitHubia pysäyttämästä ajastusta 60 päivän jälkeen

jobs:
  keraa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/keraa.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Juttujen ja ketjujen tiivistelmät
        if: always()
        run: node scripts/jutut.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Tekoälytiivistelmä
        if: always()
        run: node scripts/tiivista.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAKOTA: ${{ inputs.pakota }}
      # Pitää ajastuksen päällä (GitHub pysäyttää sen muuten 60 päivän hiljaiselon jälkeen)
      - name: Pidä ajastus päällä
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keraa.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}
