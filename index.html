<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1117">
<title>Pelicans-kooste</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="kuvakkeet/icon-192.png">
<link rel="apple-touch-icon" href="kuvakkeet/apple-touch-icon.png">
<style>
  :root {
    --tausta: #0B1117;
    --kortti: #141C24;
    --kortti2: #1B2530;
    --raja: #24313D;
    --turkoosi: #33C1D4;
    --oranssi: #F59A1B;
    --teksti: #EAF2F5;
    --harmaa: #8A9AA8;
    --voitto: #3CCB7F;
    --tappio: #E5534B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--tausta); color: var(--teksti);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  .piilossa { display: none !important; }

  /* Yläpalkki */
  header { position: sticky; top: 0; z-index: 5; background: var(--tausta);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 10px; border-bottom: 1px solid var(--raja);
    display: flex; align-items: center; gap: 12px; }
  header img { width: 34px; height: 34px; border-radius: 8px; }
  header .nimi { font-weight: 700; font-size: 19px; color: var(--turkoosi); line-height: 1.1; }
  header .aika { font-size: 13px; color: var(--harmaa); }
  header .tila { flex: 1; }
  .ikoninappi { background: none; border: 0; padding: 8px; border-radius: 10px; color: var(--harmaa); cursor: pointer; }
  .ikoninappi:active { background: var(--kortti2); }

  main { padding: 12px 12px calc(env(safe-area-inset-bottom) + 84px); max-width: 680px; margin: 0 auto; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--harmaa);
    margin: 22px 4px 10px; font-weight: 600; }
  h2:first-child { margin-top: 6px; }

  /* Kortit */
  .kortti { display: block; background: var(--kortti); border: 1px solid var(--raja); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px; position: relative; }
  a.kortti:active { background: var(--kortti2); }
  .kortti .otsikko { font-size: 18px; font-weight: 600; line-height: 1.3; }
  .kortti .kuvaus { color: #C3CED6; font-size: 15px; margin-top: 6px; }
  .meta { color: var(--harmaa); font-size: 13px; margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .kortti.uusi { border-color: rgba(245,154,27,.55); }
  .piste { width: 9px; height: 9px; border-radius: 50%; background: var(--oranssi); display: inline-block; flex: none; }
  .kortti.uusi .otsikko::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--oranssi); margin-right: 8px; vertical-align: 3px; }
  .lukko { font-size: 12px; }
  .korostus { border-left: 4px solid var(--turkoosi); }
  .klikattava { cursor: pointer; }
  .klikattava:active { background: var(--kortti2); }
  .ai { color: var(--turkoosi); font-size: 12px; font-weight: 600; margin-left: auto; }

  /* Lukunäkymä (alhaalta nouseva arkki) */
  .lukunakyma { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
  .lukunakyma .tausta { position: absolute; inset: 0; background: rgba(0,0,0,.6); }
  .arkki { position: relative; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; background: var(--kortti);
    border: 1px solid var(--raja); border-bottom: 0; border-radius: 20px 20px 0 0;
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 20px); animation: nousu .22s ease-out; }
  @keyframes nousu { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  .kahva { width: 42px; height: 5px; border-radius: 3px; background: var(--raja); margin: 0 auto 8px; cursor: pointer; }
  .sulje { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--harmaa); font-size: 26px; padding: 4px 10px; cursor: pointer; }
  .luku-otsikko { font-size: 21px; line-height: 1.3; margin: 4px 30px 14px 0; }
  .luku-otsake { color: var(--turkoosi); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin: 16px 0 6px; }
  .luku-teksti { font-size: 17px; line-height: 1.6; margin: 0; color: #DDE6EC; }
  .pointit { margin: 0; padding-left: 20px; }
  .pointit li { margin: 6px 0; line-height: 1.45; }
  .pointit li::marker { color: var(--oranssi); }
  .huom { background: rgba(245,154,27,.1); border-left: 3px solid var(--oranssi); padding: 10px 12px; border-radius: 8px;
    font-size: 14.5px; color: #F2D6B0; margin-top: 14px; }
  .luku-pieni { color: var(--harmaa); font-size: 12.5px; margin-top: 14px; }
  .linkkinappi { display: block; text-align: center; margin-top: 18px; }

  /* Ottelupäivä */
  .ottelupaiva { background: linear-gradient(135deg, #10343B, #141C24 70%); border: 1px solid var(--turkoosi);
    border-radius: 16px; padding: 14px 16px; margin: 6px 0 4px; }
  .op-otsikko { color: var(--oranssi); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  .op-rivi { display: flex; align-items: center; gap: 10px; margin: 12px 0 8px; }
  .op-joukkue { flex: 1; font-weight: 700; font-size: 18px; text-align: center; line-height: 1.2; }
  .op-joukkue.oma { color: var(--turkoosi); }
  .op-tulos { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .op-tulos span { color: var(--harmaa); margin: 0 4px; }
  .op-aika { font-size: 26px; font-weight: 800; color: var(--teksti); white-space: nowrap; }
  .op-aika small { font-size: 14px; font-weight: 600; color: var(--harmaa); }
  .op-ala { justify-content: center; margin-top: 4px; }
  .merkki.live { animation: syke 1.6s infinite; }
  @keyframes syke { 50% { opacity: .55; } }

  /* Sarjataulukon rajat */
  tr.pv td:first-child { box-shadow: inset 3px 0 var(--turkoosi); }
  tr.pp td:first-child { box-shadow: inset 3px 0 rgba(51,193,212,.4); }
  tr.ps td:first-child { box-shadow: inset 3px 0 var(--oranssi); }
  tr.putoaa td:first-child { box-shadow: inset 3px 0 var(--tappio); }
  tr.ps td { background: rgba(245,154,27,.05); }
  tr.putoaa td { background: rgba(229,83,75,.08); }
  tr.raja-pv td { border-bottom: 2px solid var(--turkoosi); }
  tr.raja-pp td { border-bottom: 2px dashed var(--oranssi); }
  tr.raja-ps td { border-bottom: 2px solid var(--tappio); }
  .selite { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12.5px; color: var(--harmaa); }
  .selite i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .s-pv { background: var(--turkoosi); } .s-pp { background: rgba(51,193,212,.4); }
  .s-ps { background: var(--oranssi); } .s-pu { background: var(--tappio); }

  .tiivis { font-size: 16.5px; line-height: 1.55; }

  /* Ottelut ja tilastot */
  .iso-tulos { color: var(--turkoosi); margin-left: 6px; }
  .tapahtumat { display: flex; flex-direction: column; }
  .era { color: var(--harmaa); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 10px 0 4px; }
  .tapahtuma { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--raja); font-size: 15px; }
  .tapahtuma .t-aika { color: var(--harmaa); font-variant-numeric: tabular-nums; width: 42px; flex: none; font-size: 13px; }
  .tapahtuma .t-tilanne { font-weight: 700; width: 38px; flex: none; font-variant-numeric: tabular-nums; }
  .tapahtuma .t-teksti small { display: block; color: var(--harmaa); font-size: 12.5px; }
  .tapahtuma em { color: var(--oranssi); font-style: normal; font-size: 12px; }
  .tapahtuma.maali.oma .t-tilanne { color: var(--turkoosi); }
  .tapahtuma.jaahy { opacity: .75; }
  .mvrivi { padding: 6px 0; } .mvrivi span { color: var(--harmaa); font-size: 14px; display: block; }
  .kokoonpano .ketju { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--raja); font-size: 14.5px; }
  .kokoonpano .ketju b { color: var(--turkoosi); width: 28px; flex: none; }
  .kokoonpano small { display: block; color: var(--harmaa); }
  .lahdelista { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .lahdelista a { color: var(--turkoosi); font-size: 14px; }
  .vire { display: flex; gap: 5px; flex-wrap: wrap; }
  .pallo { min-width: 28px; height: 28px; padding: 0 5px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; position: relative; }
  .pallo.v { background: rgba(60,203,127,.18); color: var(--voitto); } .pallo.t { background: rgba(229,83,75,.16); color: var(--tappio); }
  .pallo small { font-size: 9px; margin-left: 2px; font-weight: 600; }
  .erorivi { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--raja); }
  .erorivi small { display: block; color: var(--harmaa); font-size: 12.5px; }
  .erorivi b { font-size: 20px; } .erorivi b.plus { color: var(--voitto); } .erorivi b.miinus { color: var(--tappio); }
  .isoluku { font-size: 30px; font-weight: 800; color: var(--turkoosi); line-height: 1.1; }
  .isoluku small { display: block; font-size: 13px; color: var(--harmaa); font-weight: 500; margin-top: 2px; }
  .kaksi { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .kaavio { width: 100%; height: auto; }
  .kaavio text { fill: var(--harmaa); font-size: 9px; }
  .kaavio .k-viiva { fill: none; stroke: var(--turkoosi); stroke-width: 2.2; stroke-linejoin: round; }
  .kaavio .k-piste { fill: var(--turkoosi); }
  .kaavio .k-pv { stroke: var(--turkoosi); stroke-width: 1; opacity: .5; }
  .kaavio .k-pp { stroke: var(--oranssi); stroke-width: 1; stroke-dasharray: 4 3; opacity: .7; }
  .kaavio .k-pu { stroke: var(--tappio); stroke-width: 1; opacity: .7; }
  details > summary { cursor: pointer; color: var(--turkoosi); font-size: 14px; margin-top: 8px; list-style: none; }
  details > summary::before { content: "▸ "; } details[open] > summary::before { content: "▾ "; }
  details.kortti > summary { margin: 0; color: var(--teksti); font-weight: 600; }
  details.kortti > summary small { color: var(--harmaa); font-weight: 400; margin-left: 6px; }
  table.porssi td:nth-child(2) { text-align: left; }
  .uudet-viestit { color: var(--oranssi); font-weight: 700; }
  .kolumnikortti { border-left: 4px solid #6E7FA8; }
  .tutka-otsake { color: var(--harmaa); font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 2px; }
  .tutka-otsake:first-child { margin-top: 0; }
  .tutkarivi { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--raja); }
  .tutkarivi small { display: block; color: var(--harmaa); font-size: 12.5px; }
  .varmuus { font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; flex: none; }
  .varmuus.vahvistettu { background: rgba(60,203,127,.15); color: var(--voitto); }
  .varmuus.huhu { background: rgba(245,154,27,.15); color: var(--oranssi); }

  /* Tagit, suodattimet, asiaotsikko */
  .asiaotsikko { color: var(--turkoosi); font-size: 14.5px; margin-top: 4px; line-height: 1.35; }
  .asiaotsikko::before { content: "✦ "; font-size: 11px; }
  .tagit { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tagi { background: var(--kortti2); border: 1px solid var(--raja); color: #C3CED6; border-radius: 999px;
    padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
  .tagi.pelaaja::before { content: "👤 "; font-size: 10px; }
  .tagi.l-siirto { border-color: rgba(245,154,27,.6); color: var(--oranssi); }
  .tagi.l-otteluraportti { border-color: rgba(51,193,212,.6); color: var(--turkoosi); }
  .tagi.l-loukkaantuminen { border-color: rgba(229,83,75,.6); color: #F08A84; }
  .tagi.l-kolumni { border-color: #6E7FA8; color: #AEB9D6; }
  .sirut { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 6px; margin: 0 -2px; scrollbar-width: none; }
  .siru { flex: none; background: var(--kortti); border: 1px solid var(--raja); color: var(--teksti); border-radius: 999px;
    padding: 7px 13px; font-size: 14px; cursor: pointer; }
  .siru small { color: var(--harmaa); margin-left: 3px; }
  .siru.valittu { background: var(--turkoosi); color: #00151A; border-color: var(--turkoosi); }
  .siru.valittu small { color: #00151A; }
  .suodatinrivi { display: flex; align-items: center; gap: 10px; margin: 8px 4px; flex-wrap: wrap; }
  h2.paivaotsikko { color: var(--turkoosi); font-size: 13px; margin-top: 18px; }

  /* Kompakti lista */
  body.kompakti .kortti.klikattava { padding: 10px 14px; margin-bottom: 6px; border-radius: 10px; }
  body.kompakti .kortti .otsikko { font-size: 15.5px; font-weight: 500; }
  body.kompakti .kortti .meta { margin-top: 4px; font-size: 12px; }

  /* Lukunäkymän lisät */
  .pituusnappi { float: right; background: none; border: 1px solid var(--raja); color: var(--harmaa); border-radius: 8px;
    font-size: 12px; padding: 2px 8px; text-transform: none; letter-spacing: 0; cursor: pointer; }
  .poistonappi { display: block; width: 100%; margin-top: 10px; background: none; border: 1px solid var(--raja);
    color: var(--harmaa); border-radius: 12px; padding: 12px; cursor: pointer; font-size: 15px; }
  .poistonappi.varmista { border-color: var(--tappio); color: var(--tappio); font-weight: 600; }

  /* Pikalinkit */
  .pikalinkit { display: flex; flex-wrap: wrap; gap: 8px; }
  .pikalinkki { background: var(--kortti); border: 1px solid var(--raja); border-radius: 12px; padding: 10px 14px; font-weight: 600; }

  /* Asetukset ja ylläpito */
  .takaisin { background: none; border: 0; color: var(--turkoosi); font-size: 16px; padding: 6px 2px; cursor: pointer; }
  .asetuskortti { padding: 4px 14px; }
  .asetuskortti .rivi { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0;
    border-bottom: 1px solid var(--raja); width: 100%; }
  .asetuskortti .rivi:last-child { border-bottom: 0; }
  .rivinappi { background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .kytkin { width: 22px; height: 22px; accent-color: var(--turkoosi); }
  .valinta { display: flex; align-items: center; gap: 10px; flex: 1; }
  .valinta input { width: 20px; height: 20px; accent-color: var(--turkoosi); }
  .nuolet { display: flex; gap: 6px; }
  .nuolet button, .pieni { background: var(--kortti2); border: 1px solid var(--raja); color: var(--teksti); border-radius: 8px;
    min-width: 36px; height: 34px; cursor: pointer; padding: 0 10px; }
  .nuolet button:disabled { opacity: .3; }
  .valitsin { display: inline-flex; border: 1px solid var(--raja); border-radius: 10px; overflow: hidden; }
  .valitsin button { background: none; border: 0; color: var(--teksti); padding: 7px 14px; cursor: pointer; }
  .valitsin button.valittu { background: var(--turkoosi); color: #00151A; font-weight: 700; }
  .linkkinimi { display: flex; flex-direction: column; min-width: 0; }
  .linkkinimi small { color: var(--harmaa); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .linkkilomake { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; }
  .lahderivi { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--raja); }
  .lahderivi .ok { color: var(--voitto); font-weight: 700; } .lahderivi .vika { color: var(--tappio); font-weight: 700; }
  .lnimi { flex: 1; display: flex; flex-direction: column; } .lnimi small { color: var(--harmaa); font-size: 11.5px; }
  .lmaara { color: var(--harmaa); font-variant-numeric: tabular-nums; }
  .lvirhe { color: #F08A84; font-size: 13px; padding: 4px 0 8px 22px; }
  .pylvaat { display: flex; align-items: flex-end; gap: 4px; height: 110px; margin-top: 12px; }
  .pylvas { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
  .pylvas span { font-size: 10px; color: var(--harmaa); }
  .palkki { width: 100%; min-height: 2px; background: var(--turkoosi); border-radius: 3px 3px 0 0; display: flex; flex-direction: column-reverse; overflow: hidden; }
  .virhepalkki { background: var(--tappio); width: 100%; }
  .virherivi { padding: 8px 0; border-bottom: 1px solid var(--raja); font-size: 14px; }
  .virherivi small { display: block; color: var(--harmaa); font-size: 12px; }

  .viite { display: inline-flex; align-items: center; justify-content: center; min-width: 19px; height: 19px;
    padding: 0 5px; margin-left: 3px; border-radius: 6px; background: rgba(51,193,212,.16); color: var(--turkoosi);
    font-size: 11.5px; font-weight: 700; vertical-align: 2px; }
  .huhukortti { border-left: 4px solid var(--oranssi); }
  .huhukortti .viite { background: rgba(245,154,27,.16); color: var(--oranssi); }
  .huhurivi { border-left: 4px solid rgba(245,154,27,.6); padding: 11px 14px; }
  .vihje { color: var(--harmaa); font-size: 14px; margin: -2px 4px 4px; }
  .vihje b { color: var(--oranssi); }
  .tyhja { color: var(--harmaa); text-align: center; padding: 34px 16px; }
  .tyhja b { color: var(--teksti); display: block; margin-bottom: 6px; font-size: 17px; }

  /* Ottelut */
  .ottelu { display: flex; align-items: center; gap: 12px; }
  .ottelu .joukkueet { flex: 1; font-weight: 600; }
  .ottelu .tulos { font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
  .merkki { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .merkki.v { background: rgba(60,203,127,.15); color: var(--voitto); }
  .merkki.t { background: rgba(229,83,75,.15); color: var(--tappio); }
  .merkki.live { background: var(--oranssi); color: #000; }
  .iso { font-size: 22px; font-weight: 700; margin: 4px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
  th { color: var(--harmaa); font-weight: 500; font-size: 12px; text-align: right; padding: 4px 6px; }
  td { padding: 8px 6px; text-align: right; border-top: 1px solid var(--raja); }
  th:nth-child(2), td:nth-child(2) { text-align: left; }
  tr.oma td { color: var(--turkoosi); font-weight: 700; }

  /* Alapalkki */
  nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; background: rgba(11,17,23,.97);
    border-top: 1px solid var(--raja); display: flex; padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; background: none; border: 0; padding: 9px 2px 8px; color: var(--harmaa);
    font-size: 11.5px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; position: relative; }
  nav button svg { width: 24px; height: 24px; }
  nav button.valittu { color: var(--turkoosi); }
  nav button[data-valilehti="huhut"].valittu { color: var(--oranssi); }
  .laskuri { position: absolute; top: 4px; left: calc(50% + 6px); background: var(--oranssi); color: #000;
    font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px;
    display: flex; align-items: center; justify-content: center; }

  /* Kirjautuminen ja profiili */
  .keskitetty { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .keskitetty img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 18px; }
  .keskitetty h1 { color: var(--turkoosi); margin: 0 0 22px; font-size: 26px; }
  form, .valinnat { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
  input { font: inherit; padding: 14px 14px; border-radius: 12px; border: 1px solid var(--raja);
    background: var(--kortti); color: var(--teksti); }
  input:focus { outline: 2px solid var(--turkoosi); border-color: transparent; }
  .nappi { background: var(--turkoosi); color: #00151A; border: 0; border-radius: 12px; padding: 14px;
    font-weight: 700; cursor: pointer; font-size: 17px; }
  .nappi.toissijainen { background: var(--kortti2); color: var(--teksti); }
  .nappi:disabled { opacity: .6; }
  .virhe { color: var(--tappio); font-size: 15px; min-height: 22px; text-align: center; }

  /* Valikko ja päivitysilmoitus */
  .valikko { position: fixed; top: calc(env(safe-area-inset-top) + 60px); right: 12px; z-index: 10; background: var(--kortti2);
    border: 1px solid var(--raja); border-radius: 12px; padding: 6px; min-width: 210px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .valikko button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 12px; border-radius: 8px; cursor: pointer; }
  .valikko button:active { background: var(--raja); }
  .valikko .info { color: var(--harmaa); font-size: 13px; padding: 8px 12px 4px; }
  .ilmoitus { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 76px); z-index: 20;
    background: var(--turkoosi); color: #00151A; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px;
    font-weight: 600; max-width: 656px; margin: 0 auto; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .ilmoitus span { flex: 1; }
  .ilmoitus button { background: #00151A; color: var(--turkoosi); border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<!-- Kirjautuminen -->
<section id="kirjautuminen" class="keskitetty piilossa">
  <img src="kuvakkeet/icon-192.png" alt="">
  <h1>Pelicans-kooste</h1>
  <form id="kirjautumislomake">
    <input id="sposti" type="email" autocomplete="username" placeholder="Sähköposti" required>
    <input id="salasana" type="password" autocomplete="current-password" placeholder="Salasana" required>
    <button class="nappi" type="submit">Kirjaudu</button>
    <div class="virhe" id="kirjautumisvirhe"></div>
  </form>
</section>

<!-- Profiilin valinta (yhteinen tunnus, omat "uusi"-merkit) -->
<section id="profiilivalinta" class="keskitetty piilossa">
  <img src="kuvakkeet/icon-192.png" alt="">
  <h1>Kuka käyttää?</h1>
  <div class="valinnat">
    <button class="nappi" data-profiili="tero">Tero</button>
    <button class="nappi" data-profiili="veli">Veli</button>
  </div>
</section>

<!-- Sovellus -->
<div id="sovellus" class="piilossa">
  <header>
    <img src="kuvakkeet/icon-192.png" alt="">
    <div class="tila">
      <div class="nimi">Pelicans-kooste</div>
      <div class="aika" id="paivitetty">Ladataan…</div>
    </div>
    <button class="ikoninappi" id="valikkonappi" aria-label="Valikko">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
  </header>

  <div class="valikko piilossa" id="valikko">
    <div class="info" id="valikkoinfo"></div>
    <button id="avaaasetukset">Asetukset</button>
    <button id="avaayllapito">Ylläpito</button>
    <button id="vaihdaprofiili">Vaihda käyttäjää</button>
    <button id="kirjauduulos">Kirjaudu ulos</button>
  </div>

  <main>
    <section data-nakyma="kooste"></section>
    <section data-nakyma="uutiset" class="piilossa"></section>
    <section data-nakyma="huhut" class="piilossa"></section>
    <section data-nakyma="keskustelut" class="piilossa"></section>
    <section data-nakyma="ottelut" class="piilossa"></section>
    <section data-nakyma="asetukset" class="piilossa"></section>
    <section data-nakyma="yllapito" class="piilossa"></section>
  </main>

  <nav>
    <button data-valilehti="kooste" class="valittu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Kooste</button>
    <button data-valilehti="uutiset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>Uutiset<span class="laskuri piilossa" data-laskuri="uutiset"></span></button>
    <button data-valilehti="huhut">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M12 8v4M12 16h.01"/></svg>Huhut</button>
    <button data-valilehti="keskustelut">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h12v8H8l-4 3z"/><path d="M16 9h4v8l-3-2h-7v-2"/></svg>Keskustelut<span class="laskuri piilossa" data-laskuri="keskustelut"></span></button>
    <button data-valilehti="ottelut">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="14" rx="8" ry="3.5"/><path d="M4 14v-3c0-1.9 3.6-3.5 8-3.5s8 1.6 8 3.5v3"/></svg>Ottelut</button>
  </nav>
</div>


<div class="ilmoitus piilossa" id="ilmoitus"></div>

<div id="lukunakyma" class="lukunakyma piilossa">
  <div class="tausta" data-sulje></div>
  <div class="arkki" role="dialog" aria-modal="true">
    <div class="kahva" data-sulje></div>
    <button class="sulje" data-sulje aria-label="Sulje">×</button>
    <div id="lukusisalto"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, doc, onSnapshot, getDoc, setDoc, arrayUnion, arrayRemove }
  from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js';
import { getMessaging, getToken, isSupported } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-messaging.js';

// Push-ilmoitusten julkinen avain (Firebase → Project settings → Cloud Messaging → Web Push certificates → Key pair)
const VAPID = '';

const firebaseConfig = {
  apiKey: "AIzaSyAOTAEzO091EFVkDgut5lVt9u_zH1pl2pM",
  authDomain: "pelicans-kooste.firebaseapp.com",
  projectId: "pelicans-kooste",
  storageBucket: "pelicans-kooste.firebasestorage.app",
  messagingSenderId: "567785598357",
  appId: "1:567785598357:web:015b4aa3649048d3b5da9c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache() });

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const nakymat = ['kirjautuminen', 'profiilivalinta', 'sovellus'];
const nayta = (id) => nakymat.forEach((n) => $('#' + n).classList.toggle('piilossa', n !== id));

const PROFIILIT = { tero: 'Tero', veli: 'Veli' };
const lueProfiili = () => { try { return localStorage.getItem('profiili'); } catch { return null; } };
const tallennaProfiili = (p) => { try { p ? localStorage.setItem('profiili', p) : localStorage.removeItem('profiili'); } catch {} };

let kayttaja = null;
let raja = 0;              // "uusi" = lisätty tämän jälkeen
let istunnonAlku = Date.now();
let piilotettu = 0;
let kohteet = [];
let ottelut = null;
let ketjut = [];
let tiivistelma = null;
let tilastot = null;
let koosteet = null;
let pelaajat = null;
let paivitysAika = null;
let kuuntelijat = [];

// ---------- Apurit ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const kello = (t) => new Date(t).toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' }).replace(':', '.');
function aikaTeksti(t) {
  const ero = Date.now() - t;
  const min = Math.round(ero / 60000);
  if (min < 1) return 'juuri nyt';
  if (min < 60) return `${min} min sitten`;
  const d = new Date(t), nyt = new Date();
  const paiva = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const erot = Math.round((paiva(nyt) - paiva(d)) / 864e5);
  if (erot === 0) return `tänään ${kello(t)}`;
  if (erot === 1) return `eilen ${kello(t)}`;
  return `${d.getDate()}.${d.getMonth() + 1}. ${kello(t)}`;
}
function otteluAika(t) {
  const d = new Date(t);
  const vk = d.toLocaleDateString('fi-FI', { weekday: 'short' });
  return `${vk} ${d.getDate()}.${d.getMonth() + 1}. klo ${kello(t)}`;
}
const onUusi = (k) => raja > 0 && (k.lisatty || 0) > raja;

// ---------- Kirjautuminen ----------
$('#kirjautumislomake').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nappi = e.target.querySelector('button');
  nappi.disabled = true;
  $('#kirjautumisvirhe').textContent = '';
  try {
    await signInWithEmailAndPassword(auth, $('#sposti').value.trim(), $('#salasana').value);
  } catch (err) {
    const viestit = {
      'auth/invalid-credential': 'Väärä sähköposti tai salasana.',
      'auth/invalid-email': 'Sähköpostiosoite ei kelpaa.',
      'auth/too-many-requests': 'Liian monta yritystä. Odota hetki.',
      'auth/network-request-failed': 'Ei verkkoyhteyttä.',
    };
    $('#kirjautumisvirhe').textContent = viestit[err.code] || 'Kirjautuminen epäonnistui.';
  } finally { nappi.disabled = false; }
});

$$('[data-profiili]').forEach((b) => b.addEventListener('click', () => {
  tallennaProfiili(b.dataset.profiili);
  kaynnista();
}));

onAuthStateChanged(auth, (u) => {
  kayttaja = u;
  if (!u) { lopetaKuuntelu(); nayta('kirjautuminen'); return; }
  if (!lueProfiili()) { nayta('profiilivalinta'); return; }
  kaynnista();
});

// ---------- Käynnistys ja "uusi"-merkit ----------
const profiiliRef = () => doc(db, 'kayttajat', kayttaja.uid, 'profiilit', lueProfiili());

async function aloitaIstunto() {
  try {
    const s = await getDoc(profiiliRef());
    raja = s.exists() ? (s.data().edellinen || 0) : 0;
  } catch { raja = 0; }
  istunnonAlku = Date.now();
  setDoc(profiiliRef(), { edellinen: istunnonAlku }, { merge: true }).catch(() => {});
}

async function kaynnista() {
  nayta('sovellus');
  $('#valikkoinfo').textContent = `Käyttäjä: ${PROFIILIT[lueProfiili()] || '?'}`;
  await aloitaIstunto();
  await lataaAsetukset();
  lopetaKuuntelu();
  kuuntelijat.push(onSnapshot(doc(db, 'kooste', 'kohteet'), (s) => {
    const d = s.data() || {};
    kohteet = d.kohteet || [];
    paivitysAika = Math.max(d.paivitetty || 0, d.tarkistettu || 0) || null;
    piirra();
  }, virheKuuntelussa));
  kuuntelijat.push(onSnapshot(doc(db, 'kooste', 'ottelut'), (s) => {
    ottelut = s.data() || null;
    piirra();
  }, virheKuuntelussa));
  kuuntelijat.push(onSnapshot(doc(db, 'kooste', 'keskustelut'), (s) => {
    ketjut = s.data()?.ketjut || [];
    piirra();
  }, virheKuuntelussa));
  kuuntelijat.push(onSnapshot(doc(db, 'yhteiset', 'poistot'), (s) => {
    const d = s.data() || {};
    poistot = { ids: new Set(d.ids || []), avaimet: new Set(d.avaimet || []) };
    piirra();
  }, () => {}));
  kuuntelijat.push(onSnapshot(doc(db, 'yhteiset', 'pikalinkit'), (s) => {
    pikalinkit = s.data()?.linkit || [];
    piirra();
    if (valittu === 'asetukset') piirraAsetukset();
  }, () => {}));
  kuuntelijat.push(onSnapshot(doc(db, 'kooste', 'yllapito'), (s) => {
    yllapito = s.data() || null;
    if (valittu === 'yllapito') piirraYllapito();
  }, () => {}));
  for (const [d, aseta] of [['tilastot', (x) => { tilastot = x; }], ['koosteet', (x) => { koosteet = x; }], ['pelaajat', (x) => { pelaajat = x?.pelaajat || null; }]]) {
    kuuntelijat.push(onSnapshot(doc(db, 'kooste', d), (s) => { aseta(s.data() || null); piirra(); }, () => {}));
  }
  kuuntelijat.push(onSnapshot(doc(db, 'kooste', 'tiivistelma'), (s) => {
    tiivistelma = s.data() || null;
    piirra();
  }, virheKuuntelussa));
  piirra();
}

function virheKuuntelussa(err) {
  console.error(err);
  $('#paivitetty').textContent = err.code === 'permission-denied'
    ? 'Ei lukuoikeutta – tarkista Firestoren säännöt' : 'Yhteysvirhe';
}

function lopetaKuuntelu() { kuuntelijat.forEach((f) => f()); kuuntelijat = []; }

// Kun sovellus palaa taustalta yli 10 min jälkeen, alkaa uusi "käynti"
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { piilotettu = Date.now(); return; }
  if (kayttaja && lueProfiili() && piilotettu && Date.now() - piilotettu > 10 * 60000) {
    raja = istunnonAlku;
    istunnonAlku = Date.now();
    setDoc(profiiliRef(), { edellinen: istunnonAlku }, { merge: true }).catch(() => {});
    piirra();
  }
});

// ---------- Asetukset (profiilikohtaiset) ----------
const VALILEHDET = { kooste: 'Kooste', uutiset: 'Uutiset', huhut: 'Huhut', keskustelut: 'Keskustelut', ottelut: 'Ottelut' };
const OSIOT = { ottelupaiva: 'Ottelupäiväkortti', ennakko: 'Otteluennakko', jalki: 'Ottelun jälkeen: mitä mediat sanoivat',
  paivan: 'Päivän Pelicans', seuraava: 'Seuraava ottelu', huhut: 'Kuumimmat huhut', uutiset: 'Tuoreimmat uutiset',
  keskustelut: 'Kuumimmat keskustelut', viikko: 'Viikkokooste', kolumnit: 'Asiantuntijat sanovat' };
const OLETUS = { kompakti: false, pituus: 'lyhyt', paivaryhmat: true };
function taydenna(a) {
  const t = { ...OLETUS, ...(a || {}) };
  for (const [kentta, kaikki] of [['valilehdet', VALILEHDET], ['osiot', OSIOT]]) {
    const lista = (t[kentta] || []).filter((x) => kaikki[x.id]);
    for (const id of Object.keys(kaikki)) if (!lista.some((x) => x.id === id)) lista.push({ id, nakyvissa: true });
    t[kentta] = lista;
  }
  t.valilehdet.find((x) => x.id === 'kooste').nakyvissa = true;
  return t;
}
const lueLocal = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
let asetukset = taydenna(null);

async function lataaAsetukset() {
  asetukset = taydenna(lueLocal('asetukset-' + lueProfiili()));
  sovellaAsetukset();
  try {
    const s = await getDoc(profiiliRef());
    if (s.exists() && s.data().asetukset) asetukset = taydenna(s.data().asetukset);
    ilmoitukset = (s.exists() && s.data().ilmoitukset) || {};
  } catch {}
  sovellaAsetukset();
}
function tallennaAsetukset() {
  try { localStorage.setItem('asetukset-' + lueProfiili(), JSON.stringify(asetukset)); } catch {}
  setDoc(profiiliRef(), { asetukset }, { merge: true }).catch(() => {});
  sovellaAsetukset();
  piirra();
}
function sovellaAsetukset() {
  document.body.classList.toggle('kompakti', !!asetukset.kompakti);
  const nav = $('nav');
  for (const v of asetukset.valilehdet) {
    const b = nav.querySelector(`[data-valilehti="${v.id}"]`);
    b.classList.toggle('piilossa', !v.nakyvissa);
    nav.appendChild(b);
  }
  if (VALILEHDET[valittu] && !asetukset.valilehdet.find((v) => v.id === valittu)?.nakyvissa) valitse('kooste');
}

// ---------- Välilehdet ja sivut ----------
let valittu = 'kooste';
let edellinen = 'kooste';
function valitse(nimi) {
  if (VALILEHDET[nimi]) edellinen = nimi;
  valittu = nimi;
  $$('nav button').forEach((x) => x.classList.toggle('valittu', x.dataset.valilehti === nimi));
  $$('[data-nakyma]').forEach((s) => s.classList.toggle('piilossa', s.dataset.nakyma !== nimi));
  if (nimi === 'asetukset') piirraAsetukset();
  if (nimi === 'yllapito') piirraYllapito();
  window.scrollTo(0, 0);
}
function avaaSivu(nimi) { history.pushState({ sivu: nimi }, ''); valitse(nimi); }
$$('nav button').forEach((b) => b.addEventListener('click', () => {
  if (!VALILEHDET[valittu]) { history.back(); setTimeout(() => valitse(b.dataset.valilehti), 30); return; }
  valitse(b.dataset.valilehti);
}));

// ---------- Valikko ----------
$('#valikkonappi').addEventListener('click', (e) => { e.stopPropagation(); $('#valikko').classList.toggle('piilossa'); });
document.addEventListener('click', () => $('#valikko').classList.add('piilossa'));
$('#avaaasetukset').addEventListener('click', () => avaaSivu('asetukset'));
$('#avaayllapito').addEventListener('click', () => avaaSivu('yllapito'));
$('#vaihdaprofiili').addEventListener('click', () => { tallennaProfiili(null); lopetaKuuntelu(); nayta('profiilivalinta'); });
$('#kirjauduulos').addEventListener('click', () => { tallennaProfiili(null); signOut(auth); });

// ---------- Ilmoitus (esim. "Poistettu – Peru") ----------
let ilmoitusAjastin = null;
function naytaIlmoitus(teksti, nappi, toiminto) {
  const el = $('#ilmoitus');
  el.innerHTML = `<span>${esc(teksti)}</span>${nappi ? `<button>${esc(nappi)}</button>` : ''}`;
  el.classList.remove('piilossa');
  if (nappi) el.querySelector('button').onclick = () => { toiminto(); el.classList.add('piilossa'); };
  clearTimeout(ilmoitusAjastin);
  ilmoitusAjastin = setTimeout(() => el.classList.add('piilossa'), 6000);
}

// ---------- Poistot (yhteiset molemmille) ----------
let poistot = { ids: new Set(), avaimet: new Set() };
const avain = (o) => String(o || '').toLowerCase().normalize('NFC').replace(/[^\p{L}\p{N} ]/gu, ' ').replace(/\s+/g, ' ').trim();
const nakyvaUutinen = (k) => !poistot.ids.has(k.id) && !poistot.avaimet.has(avain(k.otsikko));
const nakyvaKetju = (k) => !poistot.ids.has(k.id);

function poista(laji, id) {
  const k = etsiKohde(laji, id);
  if (!k) return;
  const ref = doc(db, 'yhteiset', 'poistot');
  const lisaa = { ids: arrayUnion(k.id) };
  const peru = { ids: arrayRemove(k.id) };
  if (laji === 'u') { lisaa.avaimet = arrayUnion(avain(k.otsikko)); peru.avaimet = arrayRemove(avain(k.otsikko)); }
  poistot.ids.add(k.id); // näkyy heti
  if (laji === 'u') poistot.avaimet.add(avain(k.otsikko));
  setDoc(ref, lisaa, { merge: true }).catch(() => naytaIlmoitus('Poisto epäonnistui – tarkista Firestoren säännöt'));
  history.back();
  piirra();
  naytaIlmoitus(laji === 'u' ? 'Uutinen poistettu' : 'Keskustelu poistettu', 'Peru', () => {
    poistot.ids.delete(k.id);
    if (laji === 'u') poistot.avaimet.delete(avain(k.otsikko));
    setDoc(ref, peru, { merge: true }).catch(() => {});
    piirra();
  });
}

// ---------- Suodattimet (luokka ja pelaaja) ----------
const LUOKKA_NIMI = { otteluraportti: 'Otteluraportti', siirto: 'Siirto', loukkaantuminen: 'Loukkaantuminen',
  talous: 'Talous', juniorit: 'Juniorit', kolumni: 'Kolumni', muu: 'Muu' };
let suodatin = { luokka: null, pelaaja: null };
function sovellaSuodatin(arvo) {
  const [laji, ...loput] = arvo.split(':');
  const x = loput.join(':');
  if (laji === 'luokka') suodatin.luokka = suodatin.luokka === x ? null : (x || null);
  if (laji === 'pelaaja') suodatin.pelaaja = x || null;
  if (laji === 'tyhjenna') suodatin = { luokka: null, pelaaja: null };
  if (valittu !== 'uutiset') valitse('uutiset');
  piirra();
  window.scrollTo(0, 0);
}

// ---------- Piirtäminen ----------
const aiMerkki = (k) => k.tiiv && !k.tiiv.eiSaatavilla ? '<span class="ai">✦ Tiivistelmä</span>' : '';

function tagit(k, max = 3) {
  const osat = [];
  if (k.luokka && k.luokka !== 'muu') osat.push(`<button class="tagi l-${k.luokka}" data-suodata="luokka:${k.luokka}">${LUOKKA_NIMI[k.luokka]}</button>`);
  for (const p of (k.pelaajat || []).slice(0, max)) osat.push(`<button class="tagi pelaaja" data-suodata="pelaaja:${esc(p)}">${esc(p)}</button>`);
  return osat.length ? `<div class="tagit">${osat.join('')}</div>` : '';
}
const asiaRivi = (k) => k.asiaotsikko && avain(k.asiaotsikko) !== avain(k.otsikko)
  ? `<div class="asiaotsikko">${esc(k.asiaotsikko)}</div>` : '';

function uutisKortti(k) {
  const komp = asetukset.kompakti;
  return `<div class="kortti klikattava${onUusi(k) ? ' uusi' : ''}" data-avaa="u:${esc(k.id)}" role="button" tabindex="0">
    <div class="otsikko">${esc(k.otsikko)}</div>
    ${komp ? '' : asiaRivi(k)}
    ${!komp && k.kuvaus ? `<div class="kuvaus">${esc(k.kuvaus)}</div>` : ''}
    ${komp ? '' : tagit(k)}
    <div class="meta"><span>${esc(k.lahde)}</span><span>·</span><span>${aikaTeksti(k.aika)}</span>
      ${k.maksumuuri ? '<span class="lukko" title="Voi olla maksumuurin takana">🔒</span>' : ''}${aiMerkki(k)}</div>
  </div>`;
}

// ---------- Lukunäkymä: tekoälyn tiivistelmä + linkki alkuperäiseen ----------
let avoinna = null; // { laji: 'u' | 'k', id }
let pitkaAuki = null; // käyttäjän valinta tässä näkymässä (muuten asetus)

function etsiKohde(laji, id) {
  if (laji === 'o') return [...(ottelut?.pelatut || []), ...(ottelut?.tulevat || [])].find((o) => String(o.id) === String(id));
  return laji === 'u' ? kohteet.find((k) => k.id === id) : ketjut.find((k) => k.id === id);
}

function piirraLukunakyma() {
  if (!avoinna) return;
  const k = etsiKohde(avoinna.laji, avoinna.id);
  if (!k) { suljeLukunakyma(); return; }
  if (avoinna.laji === 'o') { $('#lukusisalto').innerHTML = otteluNakyma(k); return; }
  const ketju = avoinna.laji === 'k';
  const t = k.tiiv;
  const pitka = pitkaAuki ?? (asetukset.pituus === 'pitka');
  let runko;
  if (t && !t.eiSaatavilla) {
    const lyhyt = t.lyhyt || String(t.teksti || '').split(/(?<=[.!?])\s+/).slice(0, 2).join(' ');
    runko = `
      <div class="luku-otsake">✦ ${ketju ? 'Keskustelun tiivistelmä' : 'Tekoälyn tiivistelmä'}
        <button class="pituusnappi" data-pituus-vaihto>${pitka ? 'Lyhyempi' : 'Pidempi'}</button></div>
      <p class="luku-teksti">${esc(pitka ? t.teksti : lyhyt)}</p>
      ${t.pointit?.length ? `<div class="luku-otsake">${ketju ? 'Puheenaiheet' : 'Tärkeimmät tiedot'}</div>
        <ul class="pointit">${t.pointit.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
      ${t.vajaa ? `<div class="huom">${ketju ? 'Ketjussa on vähän Pelicansia koskevaa keskustelua.' : 'Juttu on osittain maksumuurin takana – tiivistelmä perustuu jutun alkuun.'}</div>` : ''}
      ${ketju ? '<div class="huom">Keskustelupalstan huhut ovat huhuja, eivät vahvistettua tietoa.</div>' : ''}
      <div class="luku-pieni">Tiivistetty klo ${kello(t.tehty)} · tarkista tiedot alkuperäisestä</div>`;
  } else if (t?.eiSaatavilla) {
    runko = `${k.kuvaus ? `<p class="luku-teksti">${esc(k.kuvaus)}</p>` : ''}
      <div class="huom">${esc(t.syy || 'Tiivistelmää ei voitu tehdä.')} Lue juttu alkuperäisestä lähteestä.</div>`;
  } else {
    runko = `${k.kuvaus ? `<p class="luku-teksti">${esc(k.kuvaus)}</p>` : ''}
      <div class="huom">Tekoälyn tiivistelmä valmistuu seuraavan keräyksen yhteydessä (noin puolen tunnin sisällä).</div>`;
  }
  $('#lukusisalto').innerHTML = `
    <div class="meta" style="margin:0 0 6px"><span>${esc(k.lahde)}</span><span>·</span>
      <span>${ketju ? 'uutta ' + aikaTeksti(k.muuttunut) : aikaTeksti(k.aika)}</span>
      ${k.maksumuuri ? '<span class="lukko">🔒</span>' : ''}</div>
    <h3 class="luku-otsikko">${esc(k.otsikko)}</h3>
    ${asiaRivi(k)}
    ${tagit(k, 6)}
    ${runko}
    <a class="nappi linkkinappi" href="${esc(k.linkki)}" target="_blank" rel="noopener">${ketju ? 'Avaa keskustelu' : 'Avaa alkuperäinen juttu'} ↗</a>
    <button class="poistonappi" data-poista>🗑 Poista ${ketju ? 'keskustelu' : 'uutinen'}</button>`;
}
$('#lukusisalto').addEventListener('click', (e) => {
  if (e.target.closest('[data-pituus-vaihto]')) {
    pitkaAuki = !(pitkaAuki ?? (asetukset.pituus === 'pitka'));
    piirraLukunakyma();
  } else if (e.target.closest('[data-poista]')) {
    const nappi = e.target.closest('[data-poista]');
    if (!nappi.dataset.varmista) { nappi.dataset.varmista = '1'; nappi.textContent = 'Vahvista poisto – ei palaa haussa'; nappi.classList.add('varmista'); return; }
    poista(avoinna.laji, avoinna.id);
  } else if (e.target.closest('[data-suodata]')) {
    const arvo = e.target.closest('[data-suodata]').dataset.suodata;
    history.back();
    setTimeout(() => sovellaSuodatin(arvo), 40);
  }
});

function avaaLukunakyma(laji, id) {
  avoinna = { laji, id };
  piirraLukunakyma();
  $('#lukunakyma').classList.remove('piilossa');
  document.body.style.overflow = 'hidden';
  history.pushState({ luku: true }, '');
}
function suljeLukunakyma() {
  avoinna = null;
  pitkaAuki = null;
  $('#lukunakyma').classList.add('piilossa');
  document.body.style.overflow = '';
}
window.addEventListener('popstate', () => {
  if (avoinna) suljeLukunakyma();
  else if (!VALILEHDET[valittu]) valitse(edellinen);
});
$('#lukunakyma').addEventListener('click', (e) => { if (e.target.closest('[data-sulje]')) history.back(); });
$('main').addEventListener('click', (e) => {
  const s = e.target.closest('[data-suodata]');
  if (s) { e.stopPropagation(); sovellaSuodatin(s.dataset.suodata); return; }
  const el = e.target.closest('[data-avaa]');
  if (!el || e.target.closest('a')) return;
  const [laji, ...id] = el.dataset.avaa.split(':');
  avaaLukunakyma(laji, id.join(':'));
});

function tulosMerkki(o) {
  const oma = o.kotona ? o.kotiMaalit : o.vierasMaalit;
  const vast = o.kotona ? o.vierasMaalit : o.kotiMaalit;
  const r = String(o.ratkaisu || '').toUpperCase();
  const lisa = r.includes('SHOT') || r.includes('SHOOTOUT') ? ' vl' : r.includes('EXTENDED') || r.includes('OVERTIME') ? ' ja' : '';
  if (oma == null || vast == null) return '';
  return oma > vast ? `<span class="merkki v">V${lisa}</span>` : `<span class="merkki t">T${lisa}</span>`;
}

// ---------- Ottelut ja tilastot ----------
function otteluKortti(o, iso = false) {
  const tulos = o.paattynyt || o.kaynnissa ? `<div class="tulos">${o.kotiMaalit ?? 0}–${o.vierasMaalit ?? 0}</div>` : '';
  const tila = o.kaynnissa ? '<span class="merkki live">KÄYNNISSÄ</span>' : o.paattynyt ? tulosMerkki(o) : '';
  const lisa = o.paattynyt && o.maalit?.length ? '<span class="ai">Tapahtumat ›</span>'
    : ottelut?.seuraavaTiedot?.id === o.id && ottelut.seuraavaTiedot.kokoonpano ? '<span class="ai">Kokoonpano ›</span>' : '';
  const klik = lisa ? ` klikattava" data-avaa="o:${o.id}" role="button` : '';
  return `<div class="kortti${iso ? ' korostus' : ''}${klik}">
    <div class="ottelu"><div class="joukkueet">${esc(o.koti)} – ${esc(o.vieras)}</div>${tulos}</div>
    <div class="meta"><span>${o.aika ? otteluAika(o.aika) : ''}</span>${tila}${o.yleiso && o.paattynyt ? `<span>· ${o.yleiso.toLocaleString('fi-FI')} katsojaa</span>` : ''}${lisa}</div>
  </div>`;
}

const kelloAika = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
function kokoonpanoHtml(kp, otsikko) {
  if (!kp) return '';
  return `<div class="luku-otsake">${esc(otsikko)}</div><div class="kokoonpano">
    ${kp.ketjut.map((k) => `<div class="ketju"><b>${k.ketju}.</b><div>${k.hyokkaajat.map(esc).join(' – ')}${k.puolustajat.length ? `<small>${k.puolustajat.map(esc).join(' – ')}</small>` : ''}</div></div>`).join('')}
    ${kp.maalivahdit.length ? `<div class="ketju"><b>MV</b><div>${kp.maalivahdit.map(esc).join(', ')}</div></div>` : ''}</div>`;
}

function otteluNakyma(o) {
  const st = ottelut?.seuraavaTiedot?.id === o.id ? ottelut.seuraavaTiedot : null;
  const kotiN = esc(o.koti), vierasN = esc(o.vieras);
  const tapahtumat = [...(o.maalit || []).map((m) => ({ ...m, laji: 'maali' })), ...(o.jaahyt || []).map((j) => ({ ...j, laji: 'jaahy' }))]
    .sort((a, b) => a.aika - b.aika);
  let era = 0;
  const rivit = tapahtumat.map((t) => {
    const otsake = t.era !== era ? `<div class="era">${t.era > 3 ? 'Jatkoaika' : t.era + '. erä'}</div>` : '';
    era = t.era;
    const puoli = t.koti ? kotiN : vierasN;
    return otsake + (t.laji === 'maali'
      ? `<div class="tapahtuma maali${(t.koti === o.kotona) ? ' oma' : ''}"><span class="t-aika">${kelloAika(t.aika)}</span>
          <span class="t-tilanne">${esc(t.tilanne)}</span><span class="t-teksti"><b>${esc(t.tekija)}</b>${t.tyyppi ? ` <em>${esc(t.tyyppi)}</em>` : ''}
          <small>${puoli}${t.syottajat?.length ? ' · ' + t.syottajat.map(esc).join(', ') : ''}</small></span></div>`
      : `<div class="tapahtuma jaahy"><span class="t-aika">${kelloAika(t.aika)}</span><span class="t-tilanne">${t.min}′</span>
          <span class="t-teksti">${esc(t.pelaaja)} <small>${puoli} · ${esc(t.rike)}</small></span></div>`);
  }).join('');
  const jalki = koosteet?.jalki?.peliId === o.id ? koosteet.jalki : null;
  const ennakko = koosteet?.ennakko?.peliId === o.id ? koosteet.ennakko : null;
  return `
    <div class="meta" style="margin:0 0 6px"><span>${o.aika ? otteluAika(o.aika) : ''}</span>${o.halli ? `<span>· ${esc(o.halli)}</span>` : ''}</div>
    <h3 class="luku-otsikko">${kotiN} – ${vierasN}${o.paattynyt ? ` <span class="iso-tulos">${o.kotiMaalit}–${o.vierasMaalit}</span>` : ''}</h3>
    ${o.paattynyt ? `<div class="meta">${tulosMerkki(o)}${o.yleiso ? `<span>${o.yleiso.toLocaleString('fi-FI')} katsojaa</span>` : ''}</div>` : ''}
    ${jalki ? `<div class="luku-otsake">✦ Mitä mediat sanoivat</div><p class="luku-teksti">${esc(jalki.teksti)}</p>
      ${jalki.lahteet?.length ? `<div class="lahdelista">${jalki.lahteet.map((l) => `<a href="${esc(l.linkki)}" target="_blank" rel="noopener">${esc(l.lahde)}: ${esc(l.otsikko)} ↗</a>`).join('')}</div>` : ''}` : ''}
    ${ennakko ? `<div class="luku-otsake">✦ Otteluennakko</div><p class="luku-teksti">${esc(ennakko.teksti)}</p>
      <ul class="pointit">${(ennakko.pointit || []).map((p) => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
    ${tapahtumat.length ? `<div class="luku-otsake">Tapahtumat</div><div class="tapahtumat">${rivit}</div>` : ''}
    ${o.maalivahdit?.length ? `<div class="luku-otsake">Pelicansin maalivahdit</div>${o.maalivahdit.map((m) =>
      `<div class="mvrivi">${esc(m.nimi)} <span>${m.torjunnat} torjuntaa · ${m.paastetyt} päästettyä${m.torjunnat + m.paastetyt ? ` · ${(m.torjunnat / (m.torjunnat + m.paastetyt) * 100).toFixed(1)} %` : ''}</span></div>`).join('')}` : ''}
    ${st ? `${kokoonpanoHtml(st.kokoonpano, 'Pelicansin kokoonpano')}${kokoonpanoHtml(st.vastustajanKokoonpano, (o.kotona ? o.vieras : o.koti) + ' – kokoonpano')}
      ${st.poissa?.length ? `<div class="huom">Poissa (Liiga): ${st.poissa.map(esc).join(', ')}</div>` : ''}
      ${!st.kokoonpano ? '<div class="huom">Kokoonpanot julkaistaan yleensä vähän ennen ottelua. Ne päivittyvät tähän keräyksen mukana.</div>' : ''}` : ''}
    ${o.liput && !o.paattynyt ? `<a class="nappi linkkinappi" href="${esc(o.liput)}" target="_blank" rel="noopener">Liput ↗</a>` : ''}`;
}

const prosentti = (x, d = 1) => (x == null ? '–' : (x * 100).toFixed(d).replace('.', ',') + ' %');

function vireHtml() {
  const v = tilastot?.vire || [];
  if (!v.length) return '';
  return `<div class="kortti"><div class="vire">${v.map((x) =>
    `<span class="pallo ${x.v ? 'v' : 't'}" title="${esc(x.vastustaja)} ${x.tulos}${x.r ? ' ' + x.r : ''}">${x.v ? 'V' : 'T'}${x.r ? `<small>${x.r}</small>` : ''}</span>`).join('')}</div>
    <div class="meta">10 viimeisintä, vanhin vasemmalla · ${v.reduce((s, x) => s + x.p, 0)} pistettä</div></div>`;
}

function pisteerotHtml() {
  const e = tilastot?.pisteerot || [];
  if (!e.length) return '';
  return `<div class="kortti">${e.map((r) => `<div class="erorivi">
      <span>${esc(r.nimi)}<small>${r.sija}. ${esc(r.joukkue)} · ${r.pisteet} p</small></span>
      <b class="${r.ero >= 0 ? 'plus' : 'miinus'}">${r.ero > 0 ? '+' : ''}${r.ero} p</b></div>
      ${r.otteluero ? `<div class="vihje" style="margin:-4px 0 6px">Pelicansilla ${Math.abs(r.otteluero)} ottelua ${r.otteluero < 0 ? 'vähemmän' : 'enemmän'} pelattuna</div>` : ''}`).join('')}</div>`;
}

function ennusteHtml() {
  const e = tilastot?.ennuste || [];
  const p = e.find((r) => /pelicans/i.test(r.joukkue));
  if (!p) return '';
  return `<div class="kortti"><div class="isoluku">${p.sija}.<small>ennustettu sija · ${p.pisteet} p / ${p.ottelut} ott.</small></div>
    <div class="vihje" style="margin:6px 0 0">Laskettu jokaisen joukkueen nykyisellä pistetahdilla koko runkosarjalle. Suuntaa antava.</div>
    <details><summary>Koko ennustetaulukko</summary><table><tbody>${e.map((r) =>
      `<tr class="${/pelicans/i.test(r.joukkue) ? 'oma' : ''}"><td>${r.sija}</td><td>${esc(r.joukkue)}</td><td>${r.pisteet}</td></tr>`).join('')}</tbody></table></details></div>`;
}

function kaavioHtml() {
  const k = (tilastot?.kaavio || []).filter((x) => x.sija);
  if (k.length < 2) return '';
  const n = Math.max(17, ...k.map((x) => x.sija));
  const L = 300, K = 140, vasen = 22, ala = 16;
  const x = (i) => vasen + (i / (k.length - 1)) * (L - vasen - 6);
  const y = (s) => 6 + ((s - 1) / (n - 1)) * (K - ala - 6);
  const rajat = ottelut?.rajat || [4, 12, 14];
  const viivat = rajat.map((r, i) => `<line x1="${vasen}" x2="${L}" y1="${y(r + 0.5)}" y2="${y(r + 0.5)}" class="${['k-pv', 'k-pp', 'k-pu'][i] || 'k-pp'}"/>`).join('');
  const polku = k.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.sija).toFixed(1)}`).join(' ');
  return `<div class="kortti"><svg viewBox="0 0 ${L} ${K}" class="kaavio" role="img" aria-label="Sijoituksen kehitys">
    ${[1, 5, 10, 15].filter((s) => s <= n).map((s) => `<text x="2" y="${y(s) + 4}">${s}</text>`).join('')}
    ${viivat}<path d="${polku}" class="k-viiva"/>
    ${k.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.sija)}" r="${i === k.length - 1 ? 4 : 2.2}" class="k-piste"><title>${p.n}. ottelu: sija ${p.sija}</title></circle>`).join('')}
    <text x="${vasen}" y="${K - 2}">1. ottelu</text><text x="${L}" y="${K - 2}" text-anchor="end">${k.length}. ottelu</text>
  </svg><div class="vihje" style="margin:4px 0 0">Sija jokaisen Pelicans-ottelun jälkeen (laskettu otteluista).</div></div>`;
}

function yvavHtml() {
  const y = tilastot?.yvav;
  if (!y) return '';
  return `<div class="kortti kaksi"><div><div class="isoluku">${prosentti(y.yv)}<small>Ylivoima · sija ${y.yvSija}/${y.joukkueita}</small></div><div class="vihje" style="margin:2px 0 0">Liigan ka. ${prosentti(y.yvKa)}</div></div>
    <div><div class="isoluku">${prosentti(y.av)}<small>Alivoima · sija ${y.avSija}/${y.joukkueita}</small></div><div class="vihje" style="margin:2px 0 0">Liigan ka. ${prosentti(y.avKa)}</div></div></div>`;
}

function porssiHtml() {
  const p = tilastot?.porssi || [];
  if (!p.length) return '';
  const rivi = (x, i) => `<tr><td>${i + 1}</td><td>${esc(x.nimi)}${x.loukkaantunut ? ' 🩹' : ''}${x.pelikielto ? ' ⛔' : ''}</td><td>${x.o}</td><td>${x.m}</td><td>${x.s}</td><td><b>${x.p}</b></td><td>${x.pm > 0 ? '+' : ''}${x.pm}</td></tr>`;
  return `<div class="kortti"><table class="porssi"><thead><tr><th>#</th><th>Pelaaja</th><th>O</th><th>M</th><th>S</th><th>P</th><th>+/-</th></tr></thead>
    <tbody>${p.slice(0, 10).map(rivi).join('')}</tbody></table>
    ${p.length > 10 ? `<details><summary>Kaikki ${p.length} pelaajaa</summary><table class="porssi"><tbody>${p.slice(10).map((x, i) => rivi(x, i + 10)).join('')}</tbody></table></details>` : ''}</div>`;
}

function maalivahdatHtml() {
  const m = tilastot?.maalivahdit || [];
  if (!m.length) return '';
  return `<div class="kortti"><table><thead><tr><th></th><th>Maalivahti</th><th>O</th><th>T%</th><th>PKA</th></tr></thead><tbody>${m.map((x) =>
    `<tr><td></td><td>${esc(x.nimi)}</td><td>${x.ottelut}</td><td>${prosentti(x.torjuntaProsentti)}</td><td>${x.paastetytKa != null ? x.paastetytKa.toFixed(2).replace('.', ',') : '–'}</td></tr>`).join('')}</tbody></table>
    <div class="vihje" style="margin:6px 0 0">T% = torjuntaprosentti, PKA = päästetyt maalit / 60 min.</div></div>`;
}

function pieniTaulukko(lista, otsikko, sarake = 'P') {
  return `<details class="kortti"><summary>${otsikko}${(() => { const p = lista.find((r) => /pelicans/i.test(r.joukkue)); return p ? ` <small>Pelicans ${p.sija}.</small>` : ''; })()}</summary>
    <table><tbody>${lista.map((r) => `<tr class="${/pelicans/i.test(r.joukkue) ? 'oma' : ''}"><td>${r.sija}</td><td>${esc(r.joukkue)}</td><td>${r.ottelut}</td><td>${r.pisteet}</td></tr>`).join('')}</tbody></table></details>`;
}

function keskinaisetHtml() {
  const t = tilastot;
  if (!t?.vastustaja) return '';
  return `<div class="kortti"><div class="otsikko" style="font-size:16px">Pelicans vs. ${esc(t.vastustaja)} tällä kaudella</div>
    ${t.keskinaiset?.length ? `<div class="vire" style="margin-top:8px">${t.keskinaiset.map((x) => `<span class="pallo ${x.v ? 'v' : 't'}" title="${x.koti ? 'koti' : 'vieras'}">${x.tulos}${x.r ? `<small>${x.r}</small>` : ''}</span>`).join('')}</div>`
      : '<div class="vihje" style="margin:6px 0 0">Ei vielä kohtaamisia tällä kaudella.</div>'}</div>`;
}

// ---------- Koosteet (viikko, ennakko, jälki, kolumnit) ----------
function koosteKortti(k, otsake, luokka = 'korostus', lisa = '') {
  if (!k) return '';
  return `<h2>${otsake}</h2><div class="kortti ${luokka}">
    <div class="otsikko" style="font-size:16.5px">${esc(k.otsikko)}</div>
    <div class="tiivis" style="margin-top:6px">${esc(k.teksti)}</div>
    ${k.pointit?.length ? `<details><summary>Tärkeimmät kohdat</summary><ul class="pointit">${k.pointit.map((p) => `<li>${esc(p)}</li>`).join('')}</ul></details>` : ''}
    ${k.lahteet?.length ? `<details><summary>Lähteet (${k.lahteet.length})</summary><div class="lahdelista">${k.lahteet.map((l) => `<a href="${esc(l.linkki)}" target="_blank" rel="noopener">${esc(l.lahde)}: ${esc(l.otsikko)} ↗</a>`).join('')}</div></details>` : ''}
    ${lisa}
    <div class="meta"><span>Tekoälyn kooste ${aikaTeksti(k.tehty)}</span></div></div>`;
}
const ennakkoAjankohtainen = () => {
  const e = koosteet?.ennakko, o = ottelut?.tulevat?.[0];
  return e && o && e.peliId === o.id && o.aika > Date.now() - 3 * 3600e3 ? e : null;
};
const jalkiAjankohtainen = () => {
  const j = koosteet?.jalki;
  return j && Date.now() - j.aika < 4 * 864e5 ? j : null;
};

// ---------- Siirtotutka ja huhut pelaajittain ----------
function siirtotutka() {
  const viimeisin = new Map();
  for (const k of [...kohteet].filter(nakyvaUutinen).sort((a, b) => a.aika - b.aika)) {
    for (const s of k.siirrot || []) {
      const ed = viimeisin.get(s.pelaaja);
      // vahvistettu tieto voittaa huhun; muuten uusin voittaa
      if (ed && ed.varmuus === 'vahvistettu' && s.varmuus === 'huhu') continue;
      viimeisin.set(s.pelaaja, { ...s, juttu: k });
    }
  }
  const ryhmat = { tulossa: [], lahdossa: [], jatkaa: [] };
  for (const s of viimeisin.values()) (ryhmat[s.suunta] || ryhmat.tulossa).push(s);
  const nimet = { tulossa: '⬇ Tulossa Pelicansiin', lahdossa: '⬆ Lähdössä', jatkaa: '✍ Jatkosopimukset' };
  const rivit = Object.entries(ryhmat).filter(([, l]) => l.length).map(([r, l]) => `<div class="tutka-otsake">${nimet[r]}</div>${l.map((s) =>
    `<div class="tutkarivi klikattava" data-avaa="u:${esc(s.juttu.id)}"><span><b>${esc(s.pelaaja)}</b><small>${[s.seura, s.sopimus].filter(Boolean).map(esc).join(' · ')}</small></span>
      <span class="varmuus ${s.varmuus}">${s.varmuus === 'vahvistettu' ? 'Vahvistettu' : 'Huhu'}</span></div>`).join('')}`).join('');
  return rivit ? `<h2>Siirtotutka</h2><div class="kortti">${rivit}<div class="vihje" style="margin:8px 0 0">Koottu uutisista tekoälyllä – voi olla puutteellinen. Napauta nähdäksesi lähdejutun.</div></div>` : '';
}

function huhutPelaajittain() {
  const laskuri = {};
  for (const k of ketjut.filter(nakyvaKetju)) for (const p of k.pelaajat || []) laskuri[p] = (laskuri[p] || 0) + 1;
  for (const k of kohteet.filter((x) => nakyvaUutinen(x) && x.luokka === 'siirto')) for (const p of k.pelaajat || []) laskuri[p] = (laskuri[p] || 0) + 1;
  const lista = Object.entries(laskuri).sort((a, b) => b[1] - a[1]).slice(0, 16);
  if (!lista.length) return '';
  return `<h2>Huhut pelaajittain</h2><div class="tagit">${lista.map(([p, n]) =>
    `<button class="tagi pelaaja" data-suodata="pelaaja:${esc(p)}">${esc(p)} <small>${n}</small></button>`).join('')}</div>`;
}

function pelaajaYhteenveto(nimi) {
  const p = pelaajat?.[nimi];
  const t = (tilastot?.porssi || []).find((x) => x.nimi === nimi);
  if (!p && !t) return '';
  return `<div class="kortti korostus">
    ${t ? `<div class="meta" style="margin:0 0 6px"><span>#${t.nro || ''} · ${t.o} ott. · ${t.m}+${t.s}=${t.p} · ${t.pm > 0 ? '+' : ''}${t.pm}</span></div>` : ''}
    ${p ? `<div class="tiivis">${esc(p.teksti)}</div>${p.pointit?.length ? `<ul class="pointit">${p.pointit.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      <div class="meta"><span>✦ Tekoälyn yhteenveto ${p.maara} maininnasta · ${aikaTeksti(p.tehty)}</span></div>`
      : '<div class="vihje" style="margin:0">Yhteenveto tehdään, kun pelaajasta on vähintään kaksi mainintaa.</div>'}
  </div>`;
}

const ketjuUusi = (k) => raja > 0 && (k.muuttunut || 0) > raja;
function ketjuKortti(k) {
  const maininta = !k.pelicansKetju && k.maininnat ? `<span>·</span><span>Pelicans mainittu ${k.maininnat} krt</span>` : '';
  return `<div class="kortti klikattava${ketjuUusi(k) ? ' uusi' : ''}" data-avaa="k:${esc(k.id)}" role="button" tabindex="0">
    <div class="otsikko">${esc(k.otsikko)}</div>
    ${k.tiiv?.asiaotsikko || k.asiaotsikko ? asiaRivi(k) : ''}
    <div class="meta"><span>${esc(k.lahde)}</span><span>·</span><span>uutta ${aikaTeksti(k.muuttunut)}</span>
      ${k.uusiaViesteja ? `<span class="uudet-viestit">+${k.uusiaViesteja} viestiä</span>` : ''}
      ${k.vastaukset != null ? `<span>· ${k.vastaukset} vastausta</span>` : ''}${maininta}${aiMerkki(k)}</div>
  </div>`;
}

// ---------- Ottelupäivä ja live-tilanne ----------
const hkiPaiva = (t) => new Date(t).toLocaleDateString('fi-FI', { timeZone: 'Europe/Helsinki' });
let live = {};          // ottelun id → tuorein tilanne suoraan Liigasta
let liveAjastin = null;
let liveToimii = null;  // null = ei kokeiltu, true/false

function paivanOttelu() {
  if (!ottelut) return null;
  const tanaan = hkiPaiva(Date.now());
  return [...(ottelut.pelatut || []), ...(ottelut.tulevat || [])].find((o) => o.aika && hkiPaiva(o.aika) === tanaan) || null;
}

async function haeLive() {
  const o = paivanOttelu();
  if (!o || document.hidden) return;
  const osoitteet = [
    `https://liiga.fi/api/v2/games/${ottelut.kausi}/${o.id}`,
    `https://liiga.fi/api/v2/games?tournament=runkosarja&season=${ottelut.kausi}`,
  ];
  for (const url of osoitteet) {
    try {
      const r = await fetch(url);
      if (!r.ok) continue;
      const d = await r.json();
      const g = Array.isArray(d) ? d.find((x) => x.id === o.id) : (d.game || d);
      if (!g?.homeTeam) continue;
      live[o.id] = {
        kotiMaalit: g.homeTeam.goals ?? o.kotiMaalit, vierasMaalit: g.awayTeam?.goals ?? o.vierasMaalit,
        kaynnissa: !!g.started && !g.ended, paattynyt: !!g.ended, ratkaisu: g.finishedType || o.ratkaisu, haettu: Date.now(),
      };
      liveToimii = true;
      piirra();
      return;
    } catch {}
  }
  liveToimii = false; // selain ei saanut tietoa suoraan Liigasta → näytetään keräyksen tieto
}

function hallitseLive() {
  const o = paivanOttelu();
  const nyt = Date.now();
  const paattynyt = o && (o.paattynyt || live[o.id]?.paattynyt);
  const aktiivinen = o && !paattynyt && nyt > o.aika - 15 * 60000 && nyt < o.aika + 5 * 3600e3 && liveToimii !== false;
  if (aktiivinen && !liveAjastin) { haeLive(); liveAjastin = setInterval(haeLive, 60000); }
  if (!aktiivinen && liveAjastin) { clearInterval(liveAjastin); liveAjastin = null; }
}

function alkuunTeksti(t) {
  const min = Math.round((t - Date.now()) / 60000);
  if (min <= 0) return 'alkaa hetkellä';
  if (min < 60) return `alkuun ${min} min`;
  return `alkuun ${Math.floor(min / 60)} h ${min % 60} min`;
}

function ottelupaivaKortti(o) {
  const x = { ...o, ...(live[o.id] || {}) };
  const oma = (n) => (/pelicans/i.test(n) ? ' oma' : '');
  let keski, ala;
  if (x.kaynnissa || x.paattynyt) {
    keski = `<div class="op-tulos">${x.kotiMaalit ?? 0}<span>–</span>${x.vierasMaalit ?? 0}</div>`;
    ala = x.kaynnissa
      ? `<span class="merkki live">KÄYNNISSÄ</span><span>${live[o.id]?.haettu ? 'päivitetty ' + kello(live[o.id].haettu) : 'päivittyy keräyksen mukana'}</span>`
      : `${tulosMerkki(x)}<span>Lopputulos</span>`;
  } else {
    keski = `<div class="op-aika"><small>klo</small> ${kello(x.aika)}</div>`;
    ala = `<span>${alkuunTeksti(x.aika)}</span>`;
  }
  return `<div class="ottelupaiva">
    <div class="op-otsikko">● Ottelupäivä</div>
    <div class="op-rivi"><div class="op-joukkue${oma(x.koti)}">${esc(x.koti)}</div>${keski}<div class="op-joukkue${oma(x.vieras)}">${esc(x.vieras)}</div></div>
    <div class="meta op-ala">${ala}</div>
  </div>`;
}

// ---------- Sarjataulukko: rajat kaudelle 2026–27 (17 joukkuetta) ----------
// 1–4 suoraan puolivälieriin, 5–12 pudotuspelien 1. kierros (neljännesvälierät), kolme viimeistä putoaa suoraan
// Rajat tulevat Liigasta (playoffsLines), oletus kaudelle 2026–27: 4 (puolivälierät), 12 (pudotuspelit), 14 (viimeinen säilyvä)
const rajat = () => (ottelut?.rajat?.length >= 3 ? ottelut.rajat : [4, 12, 14]);
function taulukonRivi(r, i) {
  const sija = Number(r.sija) || i + 1;
  const [pv, pp, sailyy] = rajat();
  const luokat = [/pelicans/i.test(r.joukkue) ? 'oma' : ''];
  if (sija <= pv) luokat.push('pv');
  else if (sija <= pp) luokat.push('pp');
  else if (sija > sailyy) luokat.push('putoaa');
  if (sija === pv) luokat.push('raja-pv');
  if (sija === pp) luokat.push('raja-pp');
  if (sija === sailyy) luokat.push('raja-ps');
  return `<tr class="${luokat.join(' ')}"><td>${esc(sija)}</td><td>${esc(r.joukkue)}</td><td>${esc(r.ottelut ?? '')}</td><td>${esc(r.pisteet ?? '')}</td></tr>`;
}

// Tiivistelmän lähdeviitteet [3] tai [2, 5] → pienet linkit
function viitteet(teksti) {
  const l = tiivistelma?.lahteet || {};
  return esc(teksti).replace(/\s*\[(\d+(?:\s*,\s*\d+)*)\]/g, (m, nrot) => {
    const linkit = nrot.split(/\s*,\s*/).filter((x) => l[x])
      .map((x) => `<a class="viite" href="${esc(l[x].linkki)}" target="_blank" rel="noopener" title="${esc(l[x].lahde + ': ' + l[x].otsikko)}">${x}</a>`);
    return linkit.length ? ' ' + linkit.join('') : '';
  });
}

function tiivistelmaKortti(teksti, huhu = false) {
  if (!tiivistelma) return `<div class="kortti korostus"><div class="kuvaus" style="margin:0">Tiivistelmää ei ole vielä tehty. Se valmistuu seuraavan keräyksen yhteydessä.</div></div>`;
  return `<div class="kortti ${huhu ? 'huhukortti' : 'korostus'}">
    <div class="tiivis">${viitteet(teksti || '')}</div>
    <div class="meta"><span>Tekoälyn tiivistelmä klo ${kello(tiivistelma.tehty)}</span><span>·</span><span>tarkista lähteistä</span></div>
  </div>`;
}

function huhuLinkit() {
  const l = tiivistelma?.lahteet || {};
  return (tiivistelma?.kuumimmatHuhut || []).map((h) => {
    const eka = l[h.lahteet?.[0]];
    const sisalto = `<div class="otsikko" style="font-size:16px">${esc(h.teksti)}</div>
      ${eka ? `<div class="meta"><span>${esc(eka.lahde)}</span></div>` : ''}`;
    return eka ? `<a class="kortti huhurivi" href="${esc(eka.linkki)}" target="_blank" rel="noopener">${sisalto}</a>`
               : `<div class="kortti huhurivi">${sisalto}</div>`;
  }).join('');
}

const tyhja = (otsikko, teksti) => `<div class="tyhja"><b>${otsikko}</b>${teksti}</div>`;

// Päiväryhmittely: Tänään / Eilen / Aiemmin
function paivaRyhma(t) {
  const p = hkiPaiva(t);
  if (p === hkiPaiva(Date.now())) return 'Tänään';
  if (p === hkiPaiva(Date.now() - 864e5)) return 'Eilen';
  return 'Aiemmin';
}
function ryhmitelty(lista, kortti, kentta = 'aika') {
  if (!asetukset.paivaryhmat) return lista.map(kortti).join('');
  let html = '', ed = null;
  for (const k of lista) {
    const r = paivaRyhma(k[kentta]);
    if (r !== ed) { html += `<h2 class="paivaotsikko">${r}</h2>`; ed = r; }
    html += kortti(k);
  }
  return html;
}

function pikalinkitHtml() {
  if (!pikalinkit.length) return `<div class="vihje">Lisää Jatkoajan ketjut tai muut suosikkisivut pikalinkeiksi: valikko ⋮ → Asetukset → Pikalinkit.</div>`;
  return `<div class="pikalinkit">${pikalinkit.map((l) =>
    `<a class="pikalinkki" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.nimi)} ↗</a>`).join('')}</div>`;
}

function piirra() {
  const uutiset = kohteet.filter((k) => k.tyyppi === 'uutinen' && nakyvaUutinen(k)).sort((a, b) => b.aika - a.aika);
  const uusia = uutiset.filter(onUusi).length;

  // Yläpalkki ja laskurit
  if (paivitysAika) $('#paivitetty').textContent = `Päivitetty klo ${kello(paivitysAika)}`;
  const asetaLaskuri = (nimi, n) => {
    const l = $(`[data-laskuri="${nimi}"]`);
    l.textContent = n;
    l.classList.toggle('piilossa', !n);
  };
  const ketjutJarj = ketjut.filter(nakyvaKetju).sort((a, b) => b.muuttunut - a.muuttunut);
  asetaLaskuri('uutiset', uusia);
  asetaLaskuri('keskustelut', ketjutJarj.filter(ketjuUusi).length);

  // Kooste: osiot asetusten mukaisessa järjestyksessä
  const paivan = paivanOttelu();
  const seuraava = ottelut?.tulevat?.find((o) => o.id !== paivan?.id);
  const osiot = {
    ottelupaiva: paivan ? ottelupaivaKortti(paivan) : '',
    paivan: `<h2>Päivän Pelicans</h2>${tiivistelmaKortti(tiivistelma?.uutiset)}
      ${uusia ? `<div class="vihje">Edellisen käyntisi jälkeen on tullut <b>${uusia === 1 ? '1 uusi uutinen' : uusia + ' uutta uutista'}</b>.</div>` : ''}`,
    seuraava: seuraava ? `<h2>Seuraava ottelu</h2>${otteluKortti(seuraava, true)}` : '',
    ennakko: koosteKortti(ennakkoAjankohtainen(), 'Otteluennakko'),
    jalki: koosteKortti(jalkiAjankohtainen(), 'Ottelun jälkeen: mitä mediat sanoivat'),
    viikko: koosteet?.viikko && Date.now() - koosteet.viikko.tehty < 7 * 864e5 ? koosteKortti(koosteet.viikko, 'Viikkokooste') : '',
    kolumnit: koosteet?.kolumnit ? koosteKortti(koosteet.kolumnit, 'Asiantuntijat sanovat', 'kolumnikortti') : '',
    huhut: tiivistelma?.kuumimmatHuhut?.length ? `<h2>Kuumimmat huhut</h2>${huhuLinkit()}` : '',
    uutiset: `<h2>Tuoreimmat uutiset</h2>${uutiset.slice(0, 3).map(uutisKortti).join('') || tyhja('Ei vielä uutisia', 'Keräys täyttää listan ensimmäisellä ajolla.')}`,
    keskustelut: ketjutJarj.length ? `<h2>Kuumimmat keskustelut</h2>${ketjutJarj.slice(0, 3).map(ketjuKortti).join('')}` : '',
  };
  $('[data-nakyma="kooste"]').innerHTML = asetukset.osiot.filter((o) => o.nakyvissa).map((o) => osiot[o.id]).join('');

  // Uutiset: suodattimet + päiväryhmät
  const luokatMaarat = {};
  for (const k of uutiset) if (k.luokka && k.luokka !== 'muu') luokatMaarat[k.luokka] = (luokatMaarat[k.luokka] || 0) + 1;
  const suodatetut = uutiset.filter((k) => (!suodatin.luokka || k.luokka === suodatin.luokka)
    && (!suodatin.pelaaja || (k.pelaajat || []).includes(suodatin.pelaaja)));
  const sirut = Object.keys(luokatMaarat).length ? `<div class="sirut">
      <button class="siru${!suodatin.luokka ? ' valittu' : ''}" data-suodata="luokka:">Kaikki</button>
      ${Object.keys(LUOKKA_NIMI).filter((l) => luokatMaarat[l]).map((l) =>
        `<button class="siru${suodatin.luokka === l ? ' valittu' : ''}" data-suodata="luokka:${l}">${LUOKKA_NIMI[l]} <small>${luokatMaarat[l]}</small></button>`).join('')}
    </div>` : '';
  const pelaajaRivi = suodatin.pelaaja ? `<div class="suodatinrivi">Pelaaja: <b>${esc(suodatin.pelaaja)}</b>
      <button class="tagi" data-suodata="pelaaja:">✕ Poista suodatin</button></div>${pelaajaYhteenveto(suodatin.pelaaja)}` : '';
  $('[data-nakyma="uutiset"]').innerHTML = uutiset.length
    ? `${sirut}${pelaajaRivi}<h2>Uutiset · ${suodatetut.length}</h2>${ryhmitelty(suodatetut, uutisKortti) || tyhja('Ei osumia', 'Tällä suodattimella ei löytynyt uutisia.')}`
    : tyhja('Ei vielä uutisia', 'Keräys täyttää listan ensimmäisellä ajolla.');

  // Huhut
  $('[data-nakyma="huhut"]').innerHTML = `
    <h2>Huhumylly</h2>
    ${tiivistelmaKortti(tiivistelma?.huhut, true)}
    ${tiivistelma?.kuumimmatHuhut?.length ? `<h2>Kuumimmat huhut</h2>${huhuLinkit()}` : ''}
    ${siirtotutka()}
    ${huhutPelaajittain()}
    ${ketjutJarj.length ? `<h2>Huhuja käsittelevät keskustelut</h2>${ketjutJarj.map(ketjuKortti).join('')}` : ''}
  `;

  // Keskustelut + pikalinkit
  $('[data-nakyma="keskustelut"]').innerHTML = `<h2>Pikalinkit</h2>${pikalinkitHtml()}` + (ketjutJarj.length
    ? `<h2>Keskustelut · ${ketjutJarj.length}</h2>` + ryhmitelty(ketjutJarj, ketjuKortti, 'muuttunut')
    : tyhja('Ei aktiivisia keskusteluja', 'Pelicans-ketjut ilmestyvät tähän, kun palstoilla puhutaan Pelicansista.'));

  // Ottelut
  if (!ottelut) {
    $('[data-nakyma="ottelut"]').innerHTML = tyhja('Ei vielä otteluita', 'Tiedot haetaan Liigasta keräyksen yhteydessä.');
  } else {
    const rivit = ottelut.sarjataulukko || [];
    const taulukko = rivit.map(taulukonRivi).join('');
    $('[data-nakyma="ottelut"]').innerHTML = `
      ${paivan ? ottelupaivaKortti(paivan) : ''}
      ${koosteKortti(ennakkoAjankohtainen(), 'Otteluennakko')}
      ${ottelut.tulevat?.length ? `<h2>Tulevat</h2>${otteluKortti(ottelut.tulevat[0], true)}${ottelut.tulevat.slice(1, 4).map((o) => otteluKortti(o)).join('')}` : ''}
      ${keskinaisetHtml()}
      ${ottelut.pelatut?.length ? `<h2>Viimeisimmät</h2>${ottelut.pelatut.slice(0, 5).map((o) => otteluKortti(o)).join('')}` : ''}
      ${tilastot?.vire?.length ? `<h2>Vire</h2>${vireHtml()}` : ''}
      ${taulukko ? `<h2>Sarjataulukko</h2><div class="kortti"><table>
        <thead><tr><th>#</th><th>Joukkue</th><th>O</th><th>P</th></tr></thead><tbody>${taulukko}</tbody></table>
        <div class="selite">
          <span><i class="s-pv"></i>1–${rajat()[0]} puolivälierät</span>
          <span><i class="s-pp"></i>${rajat()[0] + 1}–${rajat()[1]} neljännesvälierät</span>
          <span><i class="s-pu"></i>${rajat()[2] + 1}–${rivit.length} putoaa</span>
        </div></div>` : ''}
      ${tilastot?.pisteerot?.length ? `<h2>Pisteero viivoihin</h2>${pisteerotHtml()}` : ''}
      ${tilastot?.kaavio?.length > 1 ? `<h2>Sijoituksen kehitys</h2>${kaavioHtml()}` : ''}
      ${tilastot?.ennuste?.length ? `<h2>Ennuste</h2>${ennusteHtml()}` : ''}
      ${tilastot?.yvav ? `<h2>Erikoistilanteet</h2>${yvavHtml()}` : ''}
      ${tilastot?.porssi?.length ? `<h2>Pistepörssi</h2>${porssiHtml()}` : ''}
      ${tilastot?.maalivahdit?.length ? `<h2>Maalivahdit</h2>${maalivahdatHtml()}` : ''}
      ${tilastot?.kuntopuntari?.length ? `<h2>Muut taulukot</h2>${pieniTaulukko(tilastot.kuntopuntari, 'Kuntopuntari (10 viim.)')}${pieniTaulukko(tilastot.koti, 'Kotitaulukko')}${pieniTaulukko(tilastot.vieras, 'Vierastaulukko')}` : ''}
    `;
  }
  if (valittu === 'yllapito') piirraYllapito();
  piirraLukunakyma();
  hallitseLive();
  if (odottavaHash) kasitteleHash();
}

// ---------- Asetukset-sivu ----------
function jarjestysLista(kentta, nimet, lukittu = []) {
  const lista = asetukset[kentta];
  return lista.map((x, i) => `<div class="rivi">
      <label class="valinta"><input type="checkbox" data-nakyvyys="${kentta}:${x.id}" ${x.nakyvissa ? 'checked' : ''} ${lukittu.includes(x.id) ? 'disabled' : ''}>
        <span>${nimet[x.id]}</span></label>
      <span class="nuolet">
        <button data-siirra="${kentta}:${x.id}:-1" ${i === 0 ? 'disabled' : ''} aria-label="Ylös">↑</button>
        <button data-siirra="${kentta}:${x.id}:1" ${i === lista.length - 1 ? 'disabled' : ''} aria-label="Alas">↓</button>
      </span></div>`).join('');
}

function piirraAsetukset() {
  $('[data-nakyma="asetukset"]').innerHTML = `
    <button class="takaisin" data-takaisin>← Takaisin</button>
    <h2>Näkymä</h2>
    <div class="kortti asetuskortti">
      <label class="rivi"><span>Kompakti lista</span><input type="checkbox" class="kytkin" data-asetus="kompakti" ${asetukset.kompakti ? 'checked' : ''}></label>
      <label class="rivi"><span>Ryhmittely päivittäin</span><input type="checkbox" class="kytkin" data-asetus="paivaryhmat" ${asetukset.paivaryhmat ? 'checked' : ''}></label>
      <div class="rivi"><span>Tiivistelmän pituus</span>
        <span class="valitsin">
          <button data-pituus="lyhyt" class="${asetukset.pituus === 'lyhyt' ? 'valittu' : ''}">Lyhyt</button>
          <button data-pituus="pitka" class="${asetukset.pituus === 'pitka' ? 'valittu' : ''}">Pitkä</button>
        </span></div>
    </div>
    <h2>Välilehdet</h2>
    <div class="kortti asetuskortti">${jarjestysLista('valilehdet', VALILEHDET, ['kooste'])}</div>
    <h2>Kooste-välilehden osiot</h2>
    <div class="kortti asetuskortti">${jarjestysLista('osiot', OSIOT)}</div>
    <h2>Pikalinkit (yhteiset)</h2>
    <div class="kortti asetuskortti">
      ${pikalinkit.map((l, i) => `<div class="rivi"><span class="linkkinimi">${esc(l.nimi)}<small>${esc(l.url)}</small></span>
        <button class="pieni" data-poista-linkki="${i}">Poista</button></div>`).join('') || '<div class="vihje" style="margin:0">Ei vielä pikalinkkejä.</div>'}
      <div class="linkkilomake">
        <input id="linkkinimi" placeholder="Nimi, esim. Jatkoaika: Pelicans-ketju">
        <input id="linkkiurl" type="url" placeholder="https://…">
        <button class="nappi" data-lisaa-linkki>Lisää pikalinkki</button>
      </div>
    </div>
    <h2>Muuta</h2>
    <div class="kortti asetuskortti">
      <button class="rivi rivinappi" data-avaa-sivu="yllapito"><span>Ylläpito ja lähteiden tila</span><span>›</span></button>
    </div>`;
}

$('[data-nakyma="asetukset"]').addEventListener('change', (e) => {
  if (e.target.dataset.ilmoitus) return tallennaIlmoitukset({ [e.target.dataset.ilmoitus]: e.target.checked });
  const a = e.target.dataset.asetus;
  if (a) { asetukset[a] = e.target.checked; tallennaAsetukset(); }
  const n = e.target.dataset.nakyvyys;
  if (n) {
    const [kentta, id] = n.split(':');
    asetukset[kentta].find((x) => x.id === id).nakyvissa = e.target.checked;
    tallennaAsetukset();
  }
});
$('[data-nakyma="asetukset"]').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.takaisin !== undefined) return history.back();
  if (b.dataset.otaIlmoitukset !== undefined) return otaIlmoituksetKayttoon();
  if (b.dataset.pituus) { asetukset.pituus = b.dataset.pituus; tallennaAsetukset(); piirraAsetukset(); }
  if (b.dataset.siirra) {
    const [kentta, id, suunta] = b.dataset.siirra.split(':');
    const lista = asetukset[kentta];
    const i = lista.findIndex((x) => x.id === id);
    const j = i + Number(suunta);
    if (j >= 0 && j < lista.length) { [lista[i], lista[j]] = [lista[j], lista[i]]; tallennaAsetukset(); piirraAsetukset(); }
  }
  if (b.dataset.lisaaLinkki !== undefined) {
    const nimi = $('#linkkinimi').value.trim();
    let url = $('#linkkiurl').value.trim();
    if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
    try { new URL(url); } catch { return naytaIlmoitus('Tarkista osoite'); }
    if (!nimi) return naytaIlmoitus('Anna pikalinkille nimi');
    tallennaPikalinkit([...pikalinkit, { nimi: nimi.slice(0, 60), url }]);
  }
  if (b.dataset.poistaLinkki !== undefined) {
    tallennaPikalinkit(pikalinkit.filter((_, i) => i !== Number(b.dataset.poistaLinkki)));
  }
  if (b.dataset.avaaSivu) { history.replaceState({ sivu: b.dataset.avaaSivu }, ''); valitse(b.dataset.avaaSivu); }
});

let pikalinkit = [];

// ---------- Push-ilmoitukset ----------
let ilmoitukset = {};
async function otaIlmoituksetKayttoon() {
  try {
    if (!VAPID) return naytaIlmoitus('Ilmoitusavain puuttuu vielä sovelluksesta');
    if (!('Notification' in window) || !(await isSupported())) return naytaIlmoitus('Tämä selain ei tue ilmoituksia');
    const lupa = await Notification.requestPermission();
    if (lupa !== 'granted') return naytaIlmoitus('Ilmoituslupaa ei annettu – salli ilmoitukset puhelimen asetuksista');
    const reg = await navigator.serviceWorker.ready;
    const token = await getToken(getMessaging(app), { vapidKey: VAPID, serviceWorkerRegistration: reg });
    if (!token) throw new Error('ei tunnusta');
    ilmoitukset = { tulos: true, isot: true, ...ilmoitukset, token, paivitetty: Date.now() };
    await setDoc(profiiliRef(), { ilmoitukset }, { merge: true });
    naytaIlmoitus('Ilmoitukset otettu käyttöön');
  } catch (e) { naytaIlmoitus('Ilmoitusten käyttöönotto epäonnistui: ' + (e.message || e)); }
  piirraAsetukset();
}
function tallennaIlmoitukset(muutos) {
  ilmoitukset = { ...ilmoitukset, ...muutos };
  setDoc(profiiliRef(), { ilmoitukset }, { merge: true }).catch(() => {});
  piirraAsetukset();
}

// Ilmoituksesta avaaminen: #ottelut tai #u:<id>
let odottavaHash = location.hash;
function kasitteleHash() {
  const h = decodeURIComponent((odottavaHash || '').replace(/^#/, ''));
  if (!h) return;
  if (VALILEHDET[h]) { valitse(h); odottavaHash = ''; return; }
  const [laji, ...id] = h.split(':');
  if (['u', 'k', 'o'].includes(laji) && etsiKohde(laji, id.join(':'))) { odottavaHash = ''; avaaLukunakyma(laji, id.join(':')); }
}
navigator.serviceWorker?.addEventListener('message', (e) => {
