  if (e.data?.avaa) { odottavaHash = new URL(e.data.avaa).hash; kasitteleHash(); }
});
function tallennaPikalinkit(lista) {
  pikalinkit = lista;
  setDoc(doc(db, 'yhteiset', 'pikalinkit'), { linkit: lista }, { merge: true })
    .catch(() => naytaIlmoitus('Tallennus epäonnistui – tarkista Firestoren säännöt'));
  piirraAsetukset();
  piirra();
}

// ---------- Ylläpito-sivu ----------
let yllapito = null;
function piirraYllapito() {
  const y = yllapito || {};
  const lahteet = y.lahteet || [];
  const gem = y.gemini || {};
  const paivat = [];
  for (let i = 13; i >= 0; i--) paivat.push(new Date(Date.now() - i * 864e5).toLocaleDateString('sv-SE', { timeZone: 'Europe/Helsinki' }));
  const maksimi = Math.max(1, ...paivat.map((p) => gem[p]?.kutsut || 0));
  const tanaan = gem[paivat.at(-1)] || {};
  const virheet = y.virheet || [];
  $('[data-nakyma="yllapito"]').innerHTML = `
    <button class="takaisin" data-takaisin>← Takaisin</button>
    <h2>Keräys</h2>
    <div class="kortti">
      <div>Viimeisin keräys: <b>${y.keraysAika ? `${aikaTeksti(y.keraysAika)}` : 'ei tietoa'}</b></div>
      <div class="vihje" style="margin:6px 0 0">Keräys ajetaan puolen tunnin välein klo 7–23. GitHubin ajastus voi myöhästyä 5–30 min.</div>
    </div>
    <h2>Lähteet</h2>
    <div class="kortti">
      ${lahteet.map((l) => `<div class="lahderivi"><span class="${l.ok ? 'ok' : 'vika'}">${l.ok ? '✓' : '✗'}</span>
        <span class="lnimi">${esc(l.nimi)}<small>${esc(l.id)}</small></span>
        <span class="lmaara">${l.ok ? (l.maara ?? '') : ''}</span></div>
        ${!l.ok && l.virhe ? `<div class="lvirhe">${esc(l.virhe)}</div>` : ''}`).join('') || '<div class="vihje" style="margin:0">Tila päivittyy seuraavassa keräyksessä.</div>'}
    </div>
    <h2>Gemini-käyttö (14 pv)</h2>
    <div class="kortti">
      <div>Tänään: <b>${tanaan.kutsut || 0}</b> kutsua${tanaan.virheet ? `, joista <b style="color:var(--tappio)">${tanaan.virheet} epäonnistui</b>` : ''}</div>
      <div class="pylvaat">${paivat.map((p) => {
        const n = gem[p]?.kutsut || 0;
        const v = gem[p]?.virheet || 0;
        return `<div class="pylvas" title="${p}: ${n} kutsua, ${v} virhettä"><div class="palkki" style="height:${Math.round(n / maksimi * 100)}%">${v ? `<div class="virhepalkki" style="height:${Math.round(v / Math.max(n, 1) * 100)}%"></div>` : ''}</div>
          <span>${Number(p.slice(8))}.</span></div>`;
      }).join('')}</div>
      <div class="vihje" style="margin:6px 0 0">Ilmaisen tason päivärajat riippuvat mallista. Punainen = epäonnistuneet kutsut (esim. kiintiö täynnä).</div>
    </div>
    <h2>Viimeisimmät virheet</h2>
    <div class="kortti">${virheet.length ? virheet.map((v) => `<div class="virherivi"><small>${aikaTeksti(v.aika)} · ${esc(v.skripti)}</small>${esc(v.viesti)}</div>`).join('') : '<div class="vihje" style="margin:0">Ei virheitä. 👍</div>'}</div>`;
}
$('[data-nakyma="yllapito"]').addEventListener('click', (e) => { if (e.target.closest('[data-takaisin]')) history.back(); });

// Suhteelliset ajat ("5 min sitten") pysyvät ajan tasalla
setInterval(() => { if (!document.hidden && kayttaja) piirra(); }, 60000);

// ---------- Päivitykset (automaattiset) ----------
// Uusi versio otetaan käyttöön itsestään: kun sovellus avataan tai palaa taustalta,
// se tarkistaa päivityksen ja latautuu tarvittaessa uudelleen. Asennusta ei tarvitse poistaa.
if ('serviceWorker' in navigator) {
  const oliOhjain = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
    reg.waiting?.postMessage('PAIVITA');
    reg.addEventListener('updatefound', () => {
      const uusi = reg.installing;
      uusi?.addEventListener('statechange', () => { if (uusi.state === 'installed') uusi.postMessage('PAIVITA'); });
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  });
  let ladattu = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (oliOhjain && !ladattu) { ladattu = true; location.reload(); }
  });
}
</script>
</body>
